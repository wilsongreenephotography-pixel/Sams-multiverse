let db=structuredClone(BASE),addedImages={};let section='gallery',active='jordan',subtab='lore',filter='all',world='all',query='',modal=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function persist(){try{localStorage.setItem('sam_codex_data_v2',JSON.stringify(db));}catch(e){$('status').textContent='Save needs an exported backup (device storage full).';}}
try{const saved=JSON.parse(localStorage.getItem('sam_codex_data_v2')||'null');if(saved&&Array.isArray(saved.media)){db=saved;}}catch(e){}
// Merge newly published story records without overwriting user-edited records.
if(!Array.isArray(db.stories))db.stories=[];for(const story of BASE.stories){if(!db.stories.some(s=>s.id===story.id))db.stories.push(structuredClone(story));}

async function restoreImages(){if(!('indexedDB' in window))return;try{let req=indexedDB.open('sam_codex_images',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos');req.onsuccess=()=>{let tx=req.result.transaction('photos','readonly');let get=tx.objectStore('photos').getAllKeys();get.onsuccess=()=>{for(const key of get.result){let g=tx.objectStore('photos').get(key);g.onsuccess=()=>{addedImages[key]=g.result;render()}}}}}catch(e){}}
function saveImage(id,src){addedImages[id]=src;try{let req=indexedDB.open('sam_codex_images',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos');req.onsuccess=()=>{let tx=req.result.transaction('photos','readwrite');tx.objectStore('photos').put(src,id)}}catch(e){}}
const charById=id=>db.characters.find(x=>x.id===id);
function change(s){section=s;render();window.scrollTo(0,0)}
function render(){let tabs=[['gallery','▧ Gallery'],['characters','♡ Characters'],['worlds','◈ Worlds'],['stories','✦ Stories'],['lore','⌘ Lore'],['relations','♥ Love meters'],['backup','⇩ Backup']];$('tabs').innerHTML=tabs.map(([id,n])=>`<button class="${section===id?'active':''}" onclick="change('${id}')">${n}</button>`).join('');
$('status').textContent=`${db.media.filter(x=>x.status==='approved').length} confirmed · ${db.media.filter(x=>x.status==='review').length} awaiting review · ${db.media.length} total images`;
if(section==='gallery')return gallery();if(section==='characters')return characters();if(section==='worlds')return cards('worlds');if(section==='stories')return cards('stories');if(section==='lore')return cards('lore');if(section==='relations')return relations();if(section==='backup')return backup();}
function gallery(){let options=[...new Set(db.media.map(x=>x.world))].sort();$('main').innerHTML=`<div class="notice"><b>Canon-first gallery.</b> The confirmed images are approved references or the approved Veyra scene. Other historical artwork is deliberately marked <b>Awaiting review</b> until you confirm it belongs in canon. Tap a picture to edit its description, link it to a world, or approve it.</div><div class="bar"><input id="q" placeholder="Search titles, descriptions, characters…" value="${esc(query)}" oninput="query=this.value;drawGallery()"><select onchange="filter=this.value;drawGallery()"><option value="all">All statuses</option><option value="approved" ${filter==='approved'?'selected':''}>Approved</option><option value="review" ${filter==='review'?'selected':''}>Awaiting review</option></select><select onchange="world=this.value;drawGallery()"><option value="all">All worlds</option>${options.map(x=>`<option value="${esc(x)}" ${world===x?'selected':''}>${esc(x)}</option>`).join('')}</select><button onclick="$('upload').click()">＋ Add photos</button><input id="upload" type="file" accept="image/*" multiple hidden onchange="uploadFiles(event)"></div><div class="stat" id="gallerycount"></div><div class="grid" id="photos"></div>`;drawGallery()}
function drawGallery(){let arr=db.media.filter(x=>(filter==='all'||x.status===filter)&&(world==='all'||x.world===world)&&[x.title,x.description,x.world,x.character,x.kind].join(' ').toLowerCase().includes(query.toLowerCase()));$('gallerycount').textContent=`Showing ${arr.length} images`; $('photos').innerHTML=arr.map(x=>`<div class="card thumb" onclick="showPhoto('${x.id}')"><img loading="lazy" src="${img(x.id)}" alt="${esc(x.title)}"><h3>${esc(x.title)}</h3><div class="chips"><span class="chip ${x.status==='approved'?'good':'review'}">${x.status==='approved'?'✓ Approved':'? Review'}</span><span class="chip">${esc(x.world)}</span></div><p>${esc(x.description)}</p></div>`).join('')||'<p>No matching images.</p>'}
function showPhoto(id){let x=db.media.find(z=>z.id===id);if(!x)return;modal=id;$('dialog').classList.remove('hide');$('dialog').innerHTML=`<div class="panel"><div class="bar" style="justify-content:space-between"><h2 style="margin:0">Edit image record</h2><button onclick="closeModal()">✕ Close</button></div><img src="${img(id)}" alt="${esc(x.title)}"><p class="label">Title</p><input id="ptitle" style="width:100%" value="${esc(x.title)}"><p class="label">Description</p><textarea id="pdesc">${esc(x.description)}</textarea><div class="bar"><label>World <select id="pworld">${[...new Set(['Baseline','Aetheris','Crimson Dominion','Veyra','Unsorted',...db.media.map(x=>x.world)])].map(w=>`<option ${w===x.world?'selected':''}>${esc(w)}</option>`).join('')}</select></label><label>Character <input id="pchar" value="${esc(x.character)}"></label><label>Status <select id="pstatus"><option value="review" ${x.status==='review'?'selected':''}>Awaiting review</option><option value="approved" ${x.status==='approved'?'selected':''}>Approved canon</option></select></label></div><div class="btnrow"><button class="active" onclick="savePhoto()">Save entry</button><button onclick="closeModal()">Cancel</button></div></div>`}
function closeModal(){$('dialog').classList.add('hide');$('dialog').innerHTML='';modal=null}
function savePhoto(){let x=db.media.find(z=>z.id===modal);Object.assign(x,{title:$('ptitle').value,description:$('pdesc').value,world:$('pworld').value,character:$('pchar').value,status:$('pstatus').value});persist();closeModal();render()}
async function uploadFiles(e){for(let f of e.target.files){let src=await new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)});let id='user_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);db.media.unshift({id,title:f.name.replace(/\.[^.]+$/,''),description:'Newly imported artwork. Add a scene description and confirm its approval status.',world:'Unsorted',character:'Unassigned',kind:'Imported photo',status:'review'});saveImage(id,src)}persist();render()}
function characters(){let c=charById(active)||db.characters[0];if(!c)return;$('main').innerHTML=`<div class="cols"><div class="panel"><h3>Character roster</h3><div class="roster">${db.characters.map(x=>`<button class="${active===x.id?'active':''}" onclick="active='${x.id}';subtab='lore';render()"><img src="${img(x.id)}" alt=""><span>${esc(x.name)}</span></button>`).join('')}</div><p class="muted">New Sams can be added in future editions with approved portraits and lore.</p></div><div class="panel" style="--accent:${esc(c.accent||'#d7b77d')}"><div class="hero"><img src="${img(c.id)}" alt="${esc(c.name)}"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.role||c.title||'')} · ${esc(c.world||'')}</div></div></div><div class="btnrow">${['lore','love','progress'].map(t=>`<button class="${subtab===t?'active':''}" onclick="subtab='${t}';render()">${t}</button>`).join('')}</div><div id="characterbody"></div></div></div>`;
let html='';if(subtab==='lore'){for(let [k,v] of Object.entries(c)){if(['id','name','role','title','world','accent','bonds','milestones','history'].includes(k))continue;if(typeof v==='string')html+=`<p><span class="label">${esc(k)}</span><br>${esc(v)}</p>`;if(Array.isArray(v))html+=`<p class="label">${esc(k)}</p><ul>${v.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`}}
else if(subtab==='love'){let bonds=c.bonds||[];html=bonds.map(b=>{let name=typeof b==='object'&&!Array.isArray(b)?b.name:b[0],n=typeof b==='object'&&!Array.isArray(b)?b.value:b[1];if(typeof name==='string'&&charById(name))name=charById(name).name;return `<div class="meter"><div class="top"><b>${esc(name)}</b><b>${n}%</b></div><div class="track"><div class="fill" style="width:${n}%;"></div></div></div>`}).join('');if(c.id==='jordan')html+='<p class="muted">Jordan’s love for every Samantha is permanently locked at 100%.</p>'}
else html=`<h3>Milestones</h3><ul>${(c.milestones||c.history||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
$('characterbody').innerHTML=html}
function cards(type){let arr=db[type]||[];$('main').innerHTML=`<div class="grid">${arr.map(x=>`<article class="card"><h3>${esc(x.name||x.title)}</h3>${Object.entries(x).filter(([k])=>!['name','title','id'].includes(k)).map(([k,v])=>`<p><span class="label">${esc(k)}</span><br>${esc(Array.isArray(v)?v.join(' · '):typeof v==='object'?JSON.stringify(v):v)}</p>`).join('')}</article>`).join('')}</div>`}
function relations(){let pairs=[];for(let c of db.characters){for(let b of c.bonds||[]){let name=Array.isArray(b)?b[0]:b.name;let n=Array.isArray(b)?b[1]:b.value;pairs.push([c.name,name,n,c.accent])}}$('main').innerHTML=`<div class="notice">Directional feelings: one person’s affection does not automatically determine another’s. Jordan → every Samantha stays at 100%.</div><div class="grid">${pairs.map(p=>`<div class="card" style="--accent:${esc(p[3]||'#d77396')}"><div class="meter"><div class="top"><b>${esc(p[0])} → ${esc(p[1])}</b><b>${p[2]}%</b></div><div class="track"><div class="fill" style="width:${p[2]}%"></div></div></div></div>`).join('')}</div>`}
function backup(){$('main').innerHTML=`<div class="panel"><h2>Back up & update your encyclopedia</h2><p>Edits to captions and approval status are saved on this device when storage is available. For safe transfers between devices or app editions, export a complete backup including newly added photos.</p><div class="btnrow"><button class="active" onclick="exportBackup()">↓ Export full backup (JSON)</button><button onclick="$('backupfile').click()">↑ Import backup</button><input type="file" id="backupfile" accept="application/json" hidden onchange="importBackup(event)"></div><p class="muted">Offline HTML works without a server. For Android “Add to Home screen” installation with offline caching, host the included PWA folder over HTTPS. Changes on your phone do not sync into ChatGPT automatically; send me the exported backup when you want a new edition.</p></div>`}
function download(name,text,type){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportBackup(){download('samantha_codex_backup.json',JSON.stringify({format:'sam-codex-2',data:db,images:addedImages},null,2),'application/json')}
async function importBackup(e){let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!o.data||!Array.isArray(o.data.media))throw Error('Invalid backup');db=o.data;for(let [id,src] of Object.entries(o.images||{}))saveImage(id,src);persist();render();alert('Backup imported successfully.')}catch(err){alert('Could not import backup: '+err.message)}}
restoreImages();render();
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("service-worker.js").catch(()=>{});</script></body></html>
